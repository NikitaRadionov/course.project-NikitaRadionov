name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check if commit is directly to main
        run: |
          echo "❌ ERROR: Direct pushes to main are forbidden!"
          echo "This push was made by: ${{ github.actor }}"
          echo "Please use Pull Requests for all changes to main."
          echo "To fix this:"
          echo "1. Create a new branch: git checkout -b fix/description"
          echo "2. Reset main to previous state: git checkout main && git reset --hard HEAD~1"
          echo "3. Push your fix branch and create a PR"
          exit 1
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11" ]
        environment: [ "dev", "stage", "prod" ]
    timeout-minutes: 10
    env:
        SECRET_KEY: ${{ secrets[format('{0}_secret_key', matrix.environment)] }}
        DATABASE_URL: ${{ secrets[format('{0}_database_url', matrix.environment)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Pull previous Docker image (cache)
        run: |
          docker pull myapp:test || true

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: myapp:test
          cache-from: type=registry,ref=myapp:test
          cache-to: type=registry,ref=myapp:test,mode=max

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format (generate reports)
        run: |
          mkdir -p reports/linters
          ruff check --output-format=github . > reports/linters/ruff.txt || true
          black --check . > reports/linters/black.txt 2>&1 || true
          isort --check-only . > reports/linters/isort.txt 2>&1 || true

      - name: Upload linter reports
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: reports/linters/

      - name: Tests with coverage
        run: |
          mkdir -p reports
          pytest -q --junitxml=reports/junit.xml --cov=app --cov-report=html:reports/coverage-html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Build Docker image
        run: docker build -t myapp:test .

      - name: Save Docker image as artifact
        run: docker save myapp:test -o myapp_test.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: myapp_test.tar

      - name: Scan Dockerfile with Hadolint
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/Dockerfile:/Dockerfile \
            hadolint/hadolint \
            hadolint --ignore DL3008 /Dockerfile

      - name: Scan Docker image with Trivy (Docker)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 1 --severity CRITICAL myapp:test

      - name: Check non-root user
        run: |
          USER_ID=$(docker run --rm myapp:test id -u)
          echo "Container runs as UID=$USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "❌ Container runs as root!"
            exit 1
          fi

      - name: Docker image history (layers & size)
        run: docker history myapp:test --no-trunc

      - name: Deploy coverage report to GitHub Pages (mock CD)
        if: matrix.environment == 'stage'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/coverage-html
          destination_dir: coverage-report
