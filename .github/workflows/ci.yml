name: CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch-protection:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check if commit is directly to main
        run: |
          echo "❌ ERROR: Direct pushes to main are forbidden!"
          echo "This push was made by: ${{ github.actor }}"
          echo "Please use Pull Requests for all changes to main."
          echo "To fix this:"
          echo "1. Create a new branch: git checkout -b fix/description"
          echo "2. Reset main to previous state: git checkout main && git reset --hard HEAD~1"
          echo "3. Push your fix branch and create a PR"
          exit 1
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Build Docker image
        run: docker build -t myapp:test .

      - name: Scan Dockerfile with Hadolint
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/Dockerfile:/Dockerfile \
            hadolint/hadolint \
            hadolint --ignore DL3008 /Dockerfile

      - name: Scan Docker image with Trivy (Docker)
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --exit-code 1 --severity CRITICAL myapp:test

      - name: Check non-root user
        run: |
          USER_ID=$(docker run --rm myapp:test id -u)
          echo "Container runs as UID=$USER_ID"
          if [ "$USER_ID" -eq 0 ]; then
            echo "❌ Container runs as root!"
            exit 1
          fi

      - name: Docker image history (layers & size)
        run: docker history myapp:test --no-trunc
