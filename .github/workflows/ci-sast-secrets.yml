name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - 'security/**'
      - '.github/workflows/ci-sast-secrets.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.py'
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.json'
      - 'security/**'
      - '.github/workflows/ci-sast-secrets.yml'

permissions:
  contents: read
  security-events: write

concurrency:
  group: sast-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup tools
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Create evidence directory
        run: mkdir -p EVIDENCE/P10

      - name: SAST Scan with Semgrep
        run: |
          echo "Running Semgrep SAST scan..."
          docker run --rm \
            -v "$(pwd):/src" \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config=p/ci \
            --config=security/semgrep/rules.yml \
            --sarif \
            --output=EVIDENCE/P10/semgrep.sarif \
            --metrics=off \
            --error || echo "Semgrep completed (findings don't fail workflow)"

      - name: Secrets Detection with Gitleaks
        run: |
          echo "Running Gitleaks secrets detection..."
          docker run --rm \
            -v "$(pwd):/repo" \
            zricethezav/gitleaks:latest \
            detect \
            --no-banner \
            --config=/repo/security/.gitleaks.toml \
            --source=/repo \
            --report-format=json \
            --report-path=/repo/EVIDENCE/P10/gitleaks.json \
            --verbose || echo "Gitleaks completed (findings don't fail workflow)"

      - name: Generate SAST & Secrets summary
        run: |
          echo "# SAST & Secrets Scan Summary" > EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "**Scan Date:** $(date -u)" >> EVIDENCE/P10/sast_summary.md
          echo "**Commit:** ${{ github.sha }}" >> EVIDENCE/P10/sast_summary.md
          echo "**Branch:** ${GITHUB_REF##*/}" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          # Semgrep summary (как у товарища)
          echo "## Semgrep SAST Results" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            total_findings=$(jq '.runs[0].results | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            echo "**Total Findings:** $total_findings" >> EVIDENCE/P10/sast_summary.md

            # Count by severity
            error_count=$(jq '[.runs[0].results[] | select(.level == "error")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            warning_count=$(jq '[.runs[0].results[] | select(.level == "warning")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            note_count=$(jq '[.runs[0].results[] | select(.level == "note")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")

            echo "| Severity | Count |" >> EVIDENCE/P10/sast_summary.md
            echo "|----------|-------|" >> EVIDENCE/P10/sast_summary.md
            echo "| Error | $error_count |" >> EVIDENCE/P10/sast_summary.md
            echo "| Warning | $warning_count |" >> EVIDENCE/P10/sast_summary.md
            echo "| Note | $note_count |" >> EVIDENCE/P10/sast_summary.md
            echo "" >> EVIDENCE/P10/sast_summary.md

            # List top findings (максимум 5)
            if [ "$total_findings" -gt 0 ]; then
              echo "### Top Findings" >> EVIDENCE/P10/sast_summary.md
              jq -r '
                .runs[0].results[0:5] |
                .[] |
                "- **\(.level)**: \(.message.text) (Rule: \(.ruleId))"
              ' EVIDENCE/P10/semgrep.sarif >> EVIDENCE/P10/sast_summary.md 2>/dev/null || echo "Could not parse findings" >> EVIDENCE/P10/sast_summary.md
            else
              echo " No SAST findings detected" >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo " Semgrep report not generated" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md

          # Gitleaks summary (как у товарища)
          echo "## Gitleaks Secrets Detection" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md

          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            leaks_count=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            echo "**Potential Secrets Found:** $leaks_count" >> EVIDENCE/P10/sast_summary.md

            if [ "$leaks_count" -gt 0 ]; then
              echo "### Secret Types Found" >> EVIDENCE/P10/sast_summary.md
              jq -r '
                [.[].RuleID] |
                group_by(.) |
                map({rule: .[0], count: length}) |
                .[] |
                "- \(.rule): \(.count)"
              ' EVIDENCE/P10/gitleaks.json >> EVIDENCE/P10/sast_summary.md 2>/dev/null || echo "Could not parse secrets" >> EVIDENCE/P10/sast_summary.md

              # Показываем первые 3 потенциальных секрета
              echo "" >> EVIDENCE/P10/sast_summary.md
              echo "### Sample Findings" >> EVIDENCE/P10/sast_summary.md
              jq -r '
                .[0:3] |
                .[] |
                "- **\(.RuleID)** in `\(.File)` (line \(.StartLine))"
              ' EVIDENCE/P10/gitleaks.json >> EVIDENCE/P10/sast_summary.md 2>/dev/null || true
            else
              echo "No secrets detected" >> EVIDENCE/P10/sast_summary.md
            fi
          else
            echo "Gitleaks report not generated" >> EVIDENCE/P10/sast_summary.md
          fi

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "## Next Steps" >> EVIDENCE/P10/sast_summary.md
          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "1. Review detailed reports:" >> EVIDENCE/P10/sast_summary.md
          echo "   - SAST: [semgrep.sarif](semgrep.sarif)" >> EVIDENCE/P10/sast_summary.md
          echo "   - Secrets: [gitleaks.json](gitleaks.json)" >> EVIDENCE/P10/sast_summary.md
          echo "2. Fix critical (Error) findings first" >> EVIDENCE/P10/sast_summary.md
          echo "3. Add false positives to allowlists" >> EVIDENCE/P10/sast_summary.md
          echo "4. Regular scanning on code changes" >> EVIDENCE/P10/sast_summary.md

          echo "" >> EVIDENCE/P10/sast_summary.md
          echo "---" >> EVIDENCE/P10/sast_summary.md
          echo "*Generated automatically by GitHub Actions*" >> EVIDENCE/P10/sast_summary.md

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: EVIDENCE/P10/semgrep.sarif
          category: "semgrep"

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-sast-secrets-evidence
          path: EVIDENCE/P10/
          retention-days: 30

      - name: Security scan summary (informational)
        if: always()
        run: |
          echo "=== Security Scan Summary ==="
          echo ""

          # Semgrep summary
          if [ -f EVIDENCE/P10/semgrep.sarif ]; then
            error_count=$(jq '[.runs[0].results[] | select(.level == "error")] | length' EVIDENCE/P10/semgrep.sarif 2>/dev/null || echo "0")
            if [ "$error_count" -gt 0 ]; then
              echo " Found $error_count ERROR level SAST findings"
              echo " Review EVIDENCE/P10/semgrep.sarif"
            else
              echo " No ERROR level SAST findings"
            fi
          fi

          # Gitleaks summary
          if [ -f EVIDENCE/P10/gitleaks.json ]; then
            leaks_count=$(jq '. | length' EVIDENCE/P10/gitleaks.json 2>/dev/null || echo "0")
            if [ "$leaks_count" -gt 0 ]; then
              echo " Found $leaks_count potential secrets"
              echo " Review EVIDENCE/P10/gitleaks.json"
            else
              echo " No secrets detected"
            fi
          fi

          echo ""
          echo "For P10, findings don't fail the workflow."
          echo "In production, consider failing on critical findings."
