name: Security - SBOM & SCA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '**/*.py'
      - '.github/workflows/ci-sbom-sca.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'requirements*.txt'
      - 'pyproject.toml'
      - '**/*.py'
      - '.github/workflows/ci-sbom-sca.yml'

permissions:
  contents: read

concurrency:
  group: sbom-sca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-sca:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create evidence directory
      run: mkdir -p EVIDENCE/P09

    - name: Install jq for JSON processing
      run: sudo apt-get update && sudo apt-get install -y jq

    - name: Generate SBOM with Syft
      run: |
        docker run --rm \
          -v "$(pwd):/work" \
          -w /work \
          anchore/syft:latest \
          packages dir:. \
          --output cyclonedx-json \
          --file EVIDENCE/P09/sbom.json

    - name: SCA Scan with Grype (using SBOM)
      run: |
        docker run --rm \
          -v "$(pwd):/work" \
          -w /work \
          anchore/grype:latest \
          sbom:/work/EVIDENCE/P09/sbom.json \
          --output json \
          --file EVIDENCE/P09/sca_report.json

    - name: Generate summary report
      run: |
        if [ ! -f "EVIDENCE/P09/sca_report.json" ]; then
          echo "Error: sca_report.json not found!"
          exit 1
        fi

        echo "# SCA Vulnerability Summary" > EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md
        echo "Generated: $(date)" >> EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md

        # Теперь jq установлен, можно анализировать
        TOTAL=$(jq '.matches | length' EVIDENCE/P09/sca_report.json 2>/dev/null || echo "0")
        CRITICAL=$(jq '[.matches[] | select(.vulnerability.severity == "Critical")] | length' EVIDENCE/P09/sca_report.json 2>/dev/null || echo "0")
        HIGH=$(jq '[.matches[] | select(.vulnerability.severity == "High")] | length' EVIDENCE/P09/sca_report.json 2>/dev/null || echo "0")
        MEDIUM=$(jq '[.matches[] | select(.vulnerability.severity == "Medium")] | length' EVIDENCE/P09/sca_report.json 2>/dev/null || echo "0")
        LOW=$(jq '[.matches[] | select(.vulnerability.severity == "Low")] | length' EVIDENCE/P09/sca_report.json 2>/dev/null || echo "0")

        echo "## Scan Results" >> EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md
        echo "**Total vulnerabilities found:** $TOTAL" >> EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md

        if [ "$TOTAL" -eq 0 ]; then
          echo "No vulnerabilities found." >> EVIDENCE/P09/sca_summary.md
        else
          echo "### Severity Breakdown" >> EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md
          echo "- **Critical:** $CRITICAL" >> EVIDENCE/P09/sca_summary.md
          echo "- **High:** $HIGH" >> EVIDENCE/P09/sca_summary.md
          echo "- **Medium:** $MEDIUM" >> EVIDENCE/P09/sca_summary.md
          echo "- **Low:** $LOW" >> EVIDENCE/P09/sca_summary.md
          echo "" >> EVIDENCE/P09/sca_summary.md

          # Показываем только High/Critical
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "### High/Critical Vulnerabilities" >> EVIDENCE/P09/sca_summary.md
            echo "" >> EVIDENCE/P09/sca_summary.md
            jq -r '
              .matches[] |
              select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High") |
              "- **" + .vulnerability.id + "** (" + .vulnerability.severity + "): " +
              .artifact.name + "@" + .artifact.version +
              " - " + (.vulnerability.description // "No description" | sub("^(.{100}).*"; "\1..."))
            ' EVIDENCE/P09/sca_report.json >> EVIDENCE/P09/sca_summary.md 2>/dev/null || echo "No details available" >> EVIDENCE/P09/sca_summary.md
          fi
        fi

        echo "" >> EVIDENCE/P09/sca_summary.md
        echo "## Scan Details" >> EVIDENCE/P09/sca_summary.md
        echo "- SBOM generated with: Syft" >> EVIDENCE/P09/sca_summary.md
        echo "- SCA tool: Grype" >> EVIDENCE/P09/sca_summary.md
        echo "- Source: Project dependencies" >> EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md
        echo "## Next Steps" >> EVIDENCE/P09/sca_summary.md
        echo "1. Review vulnerabilities in sca_report.json" >> EVIDENCE/P09/sca_summary.md
        echo "2. Update dependencies if critical/high severity found" >> EVIDENCE/P09/sca_summary.md
        echo "3. Add waivers to policy/waivers.yml for false positives" >> EVIDENCE/P09/sca_summary.md
        echo "" >> EVIDENCE/P09/sca_summary.md
        echo "---" >> EVIDENCE/P09/sca_summary.md
        echo "*Automatically generated by GitHub Actions*" >> EVIDENCE/P09/sca_summary.md

    - name: Create waiver policy template
      run: |
        mkdir -p policy
        cat > policy/waivers.yml << 'EOF'
        # Vulnerability Waivers Policy
        # P09: SBOM & SCA

        version: "1.0"
        created: "$(date -I)"

        policy:
          default_expiry_days: 90

          critical_severity_actions:
            - must_fix_within_days: 30
            - requires_team_lead_approval: true

          high_severity_actions:
            - must_fix_within_days: 60
            - requires_tech_lead_approval: true

          medium_low_severity_actions:
            - waiver_allowed: true
            - requires_review: true

        waivers:
        EOF

    - name: Verify evidence files exist
      run: |
        echo "Checking generated files:"
        ls -la EVIDENCE/P09/
        echo ""
        echo "File sizes:"
        wc -l EVIDENCE/P09/sbom.json || echo "sbom.json missing"
        wc -l EVIDENCE/P09/sca_report.json || echo "sca_report.json missing"
        wc -l EVIDENCE/P09/sca_summary.md || echo "sca_summary.md missing"

    - name: Upload evidence artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom-sca-evidence
        path: |
          EVIDENCE/P09/
          policy/
        retention-days: 90
